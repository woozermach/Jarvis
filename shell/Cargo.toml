[package]
name = "oswin"
version = "1.0.0"
edition = "2021"
description = "Oswin voice assistant"

[[bin]]
name = "Oswin"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.53"
ureq = { version = "2", default-features = false }
serde_json = "1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
