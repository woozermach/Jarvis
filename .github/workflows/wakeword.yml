name: Wake word

# Обучение модели слова активации «Hey Oswin» (openWakeWord) на синтетической речи Piper (900+ голосов).
# 1) gen: до 20 машин параллельно генерируют фразы (на процессоре ~1 фраза/с); 2) train: шумы, эхо, признаки, обучение.
# Запуск вручную: Actions → Wake word → Run workflow. Результат — артефакт hey_oswin (onnx + журнал обучения).
on:
  workflow_dispatch:
    inputs:
      n_samples:
        description: "Positive samples (total)"
        default: "20000"
      steps:
        description: "Training steps"
        default: "30000"
      shards:
        description: "Parallel generators (max 20)"
        default: "20"

defaults:
  run:
    shell: bash

env:
  W: /mnt/ww

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.shards }}))))")" >> $GITHUB_OUTPUT

  gen:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo mkdir -p $W && sudo chown $USER $W
          bash tools/wakeword/install.sh
      - name: Generate
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          N=$(( ${{ inputs.n_samples }} / ${{ inputs.shards }} ))
          mkdir -p $W/data/mit_rirs $W/data/background
          python tools/wakeword/make_config.py $W/oww/examples/custom_model.yml $W/cfg.yml $W $N ${{ inputs.steps }} ${{ inputs.shards }} > /dev/null
          cd $W
          python $GITHUB_WORKSPACE/tools/wakeword/run_train.py oww/openwakeword/train.py --training_config cfg.yml --generate_clips 2>&1 \
            | (grep -vE "it/s\]|Batch [0-9]+/[0-9]+ complete|connectionpool" || true)
          for d in positive_train positive_test negative_train negative_test; do echo "$d: $(ls model/hey_oswin/$d | wc -l)"; done
          tar -C model/hey_oswin -cf $W/clips.tar positive_train positive_test negative_train negative_test
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.shard }}
          path: /mnt/ww/clips.tar
          retention-days: 3

  train:
    needs: gen
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo mkdir -p $W && sudo chown $USER $W
          bash tools/wakeword/install.sh
      - name: Background, RIR, features
        run: |
          cd $W
          python $GITHUB_WORKSPACE/tools/wakeword/prepare_data.py $W/data
          wget -q https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/openwakeword_features_ACAV100M_2000_hrs_16bit.npy
          wget -q https://huggingface.co/datasets/davidscripka/openwakeword_features/resolve/main/validation_set_features.npy
          df -h /mnt
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: /mnt/ww/clips
      - name: Merge clips
        run: |
          mkdir -p $W/model/hey_oswin
          for t in $W/clips/*/clips.tar; do tar -C $W/model/hey_oswin -xf "$t"; done
          rm -rf $W/clips
          for d in positive_train positive_test negative_train negative_test; do echo "$d: $(ls $W/model/hey_oswin/$d | wc -l)"; done
          python tools/wakeword/make_config.py $W/oww/examples/custom_model.yml $W/cfg.yml $W ${{ inputs.n_samples }} ${{ inputs.steps }}
      - name: Augment
        run: |
          cd $W
          python $GITHUB_WORKSPACE/tools/wakeword/run_train.py oww/openwakeword/train.py --training_config cfg.yml --augment_clips 2>&1 \
            | (grep -vE "it/s\]|connectionpool" || true)
      - name: Train
        run: |
          cd $W
          python $GITHUB_WORKSPACE/tools/wakeword/run_train.py oww/openwakeword/train.py --training_config cfg.yml --train_model 2>&1 \
            | (grep -vE "it/s\]|connectionpool" || true) | tee train.log
          ls -la model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hey_oswin
          path: |
            /mnt/ww/model/*.onnx
            /mnt/ww/train.log
            /mnt/ww/cfg.yml
          if-no-files-found: warn
