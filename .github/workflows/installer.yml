name: Installer

# Собирает OswinSetup.exe (Python 3.13 + все библиотеки + модели внутри) и выкладывает в Releases.
# Запускается при изменении VERSION в main или вручную (Actions → Installer → Run workflow).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Oswin $ver"

      - name: Stage app files
        shell: pwsh
        run: |
          $stage = "build\app"
          New-Item $stage -ItemType Directory -Force | Out-Null
          robocopy . $stage /E /NFL /NDL /NJH /NJS /XD .git .github build data __pycache__ .venv py installer docs /XF config.json jarvis.log CLAUDE.local.md
          if ($LASTEXITCODE -ge 8) { exit 1 }
          exit 0

      - name: Bundle Python 3.13
        shell: pwsh
        run: |
          $idx = Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/python/index.json
          $pyv = $idx.versions | Where-Object { $_ -match '^3\.13\.\d+$' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          Write-Host "Python $pyv"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/python/$pyv/python.$pyv.nupkg" -OutFile build\py.zip
          Expand-Archive build\py.zip build\pyx -Force
          # кладём Python прямо в .venv\Scripts — те же пути, что у ручной установки (обновления/перезапуск не меняются)
          New-Item build\app\.venv -ItemType Directory -Force | Out-Null
          Move-Item build\pyx\tools build\app\.venv\Scripts
          $py = "build\app\.venv\Scripts\python.exe"
          & $py -m ensurepip --upgrade
          & $py -m pip install --upgrade pip --no-warn-script-location --disable-pip-version-check
          & $py -m pip install -r requirements.txt --no-warn-script-location --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Wake-word models
        shell: pwsh
        working-directory: build\app
        run: |
          .venv\Scripts\python.exe -c "import sys,types;m=types.ModuleType('x');m.train_custom_verifier=None;sys.modules['openwakeword.custom_verifier_model']=m;from openwakeword.utils import download_models;download_models(model_names=['hey_jarvis']);print('models ok')"

      - name: Smoke test
        shell: pwsh
        working-directory: build\app
        run: |
          .venv\Scripts\python.exe -c "import sys;print(sys.version);sys.path.insert(0,'.');import numpy,aiohttp,requests,psutil,PIL,sounddevice,pycaw,pystray,openwakeword,webview;import core.config,core.brand,core.license,core.updater;print('imports ok', core.brand.NAME)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          "{0:N0} MB" -f ((Get-ChildItem -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          python installer\gen_languages.py "${env:ProgramFiles(x86)}\Inno Setup 6"
          & $iscc /Qp "/DAppVersion=${{ steps.v.outputs.ver }}" installer\oswin.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\out\OswinSetup.exe "build\out\OswinSetup-${{ steps.v.outputs.ver }}.exe"
          Get-ChildItem build\out | Format-Table Name, Length

      - name: Test install / uninstall
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\OswinTest"
          Start-Process build\out\OswinSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$d","/TASKS=" -Wait
          if (-not (Test-Path "$d\.venv\Scripts\pythonw.exe")) { Write-Error "not installed"; exit 1 }
          & "$d\.venv\Scripts\python.exe" -c "import sys;sys.path.insert(0,r'$d');import core.assistant;print('installed ok')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # окно WebView2: должно появиться окно «Oswin» процесса pythonw
          $w = Start-Process "$d\.venv\Scripts\pythonw.exe" -ArgumentList "`"$d\core\window.py`"","about:blank" -WorkingDirectory $d -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep 1; $ok = [bool](Get-Process -Id $w.Id -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "Oswin*" }) }
          Get-Content "$d\data\window.log" -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "WebView2 window did not appear"; exit 1 }
          Start-Sleep 3
          if (Select-String -Path "$d\data\window.log" -Pattern "WARNING" -Quiet) { Get-Content "$d\data\window.log"; Write-Error "window.py warnings"; exit 1 }
          Write-Host "webview window ok"
          Stop-Process -Id $w.Id -Force
          Start-Process "$d\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$d\core"); $i++) { Start-Sleep 1 }
          if (Test-Path "$d\core") { Write-Error "uninstall left files"; exit 1 }
          Write-Host "uninstall ok"

      - uses: actions/upload-artifact@v4
        with:
          name: OswinSetup-${{ steps.v.outputs.ver }}
          path: build/out/OswinSetup.exe

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $notes = "Download **OswinSetup.exe** below and run it. Windows 10/11, no admin rights needed.`n`nWhat's new: see CHANGELOG.md"
          gh release view "v$ver" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$ver" build\out\OswinSetup.exe "build\out\OswinSetup-$ver.exe" --clobber
          } else {
            gh release create "v$ver" build\out\OswinSetup.exe "build\out\OswinSetup-$ver.exe" --title "Oswin $ver" --notes $notes --latest
          }
